<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">CodePet Logo</title>
  <desc id="logoDesc">Codey, el gatito programador con gafas de desarrollador y micro-animaciones fluidas en un entorno cibernético.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="45%" stop-color="#121832"/>
      <stop offset="100%" stop-color="#24133d"/>
    </linearGradient>

    <!-- Neon Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>

    <!-- Fur and Patch Gradients -->
    <radialGradient id="furGrad" cx="45%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#edd5bd"/>
    </radialGradient>
    <radialGradient id="patchGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="60%" stop-color="#d97724"/>
      <stop offset="100%" stop-color="#a35414"/>
    </radialGradient>

    <!-- Glasses Lens Hologram -->
    <linearGradient id="lensHolo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Head Clipping -->
    <clipPath id="headClip">
      <ellipse cx="96" cy="100" rx="60" ry="49"/>
    </clipPath>
    <clipPath id="leftLensClip">
      <circle cx="68" cy="98" r="21"/>
    </clipPath>
    <clipPath id="rightLensClip">
      <circle cx="124" cy="98" r="21"/>
    </clipPath>

    <style>
      @keyframes floatHead {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.5px); }
      }
      @keyframes earTwitchL {
        0%, 88%, 100% { transform: rotate(0deg); }
        92% { transform: rotate(-5deg); }
        96% { transform: rotate(2deg); }
      }
      @keyframes earTwitchR {
        0%, 84%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(5deg); }
        93% { transform: rotate(-2deg); }
      }
      @keyframes naturalBlink {
        0%, 93%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.08); }
      }
      @keyframes gleamSwipe {
        0%, 65% { transform: translateX(-35px) rotate(25deg); opacity: 0; }
        70% { opacity: 0.8; }
        85% { transform: translateX(35px) rotate(25deg); opacity: 0.8; }
        90%, 100% { opacity: 0; }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.5; filter: drop-shadow(0 0 4px #00f5a0); }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 10px #00d2ff); }
      }
      @keyframes sparkleAnim {
        0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.2) rotate(90deg); opacity: 1; }
      }
      @keyframes codePulse {
        0%, 100% { opacity: 0.25; transform: scale(0.95); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }

      .logo-body { animation: floatHead 3.8s ease-in-out infinite; }
      .ear-l { transform-origin: 52px 76px; animation: earTwitchL 4.5s ease-in-out infinite; }
      .ear-r { transform-origin: 140px 76px; animation: earTwitchR 5s ease-in-out infinite; }
      .blink-eye { transform-origin: 96px 98px; animation: naturalBlink 4s ease-in-out infinite; }
      .gleam-effect { animation: gleamSwipe 5s ease-in-out infinite; }
      .border-pulse { animation: pulseBorder 3.5s ease-in-out infinite; }
      .sparkle-1 { transform-origin: 154px 38px; animation: sparkleAnim 2.8s ease-in-out infinite; }
      .sparkle-2 { transform-origin: 32px 148px; animation: sparkleAnim 3.2s ease-in-out infinite 1.4s; }
      .code-tag { animation: codePulse 3s ease-in-out infinite; }
      .orbit-group { transform-origin: 96px 96px; animation: orbitSpin 25s linear infinite; }
    </style>
  </defs>

  <!-- Base App Icon Tile -->
  <rect x="3" y="3" width="186" height="186" rx="46" fill="url(#bgGrad)"/>
  <rect class="border-pulse" x="3" y="3" width="186" height="186" rx="46" fill="none" stroke="url(#borderGrad)" stroke-width="2.8"/>

  <!-- Subtle Cyber Tech Background Geometry -->
  <g opacity="0.22" stroke="#00f5a0" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M22 36h22l14 14h18"/>
    <circle cx="76" cy="50" r="2.2" fill="#00f5a0"/>
    <path d="M170 152h-24l-14-14h-18"/>
    <circle cx="114" cy="138" r="2.2" fill="#00d2ff"/>
    <path d="M16 102l12-12h14"/>
    <circle cx="42" cy="90" r="1.5" fill="#a855f7"/>
    <path d="M176 90l-12 12h-14"/>
    <circle cx="150" cy="102" r="1.5" fill="#00f5a0"/>
  </g>

  <!-- Orbiting Micro Particles -->
  <g class="orbit-group" opacity="0.6">
    <circle cx="96" cy="16" r="2.5" fill="#00f5a0" filter="url(#starGlow)"/>
    <circle cx="176" cy="96" r="2" fill="#00d2ff" filter="url(#starGlow)"/>
    <circle cx="96" cy="176" r="2.2" fill="#ff007a" filter="url(#starGlow)"/>
    <circle cx="16" cy="96" r="1.8" fill="#ffd166" filter="url(#starGlow)"/>
  </g>

  <!-- Ambient Code Brackets in Background -->
  <g class="code-tag" font-family="Consolas, 'JetBrains Mono', monospace" font-size="20" font-weight="900" fill="#00f5a0">
    <text x="14" y="104">&lt;</text>
    <text x="166" y="104">&gt;</text>
  </g>

  <!-- Sparkles -->
  <g class="sparkle-1" transform="translate(154, 38)">
    <path d="M0 -8 Q1 -1 8 0 Q1 1 0 8 Q-1 1 -8 0 Q-1 -1 0 -8Z" fill="#00f5a0" filter="url(#starGlow)"/>
  </g>
  <g class="sparkle-2" transform="translate(32, 148)">
    <path d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6Z" fill="#ffd166" filter="url(#starGlow)"/>
  </g>

  <!-- Codey the Programmer Cat -->
  <g class="logo-body">
    <!-- Left Ear (Calico Orange Patch) -->
    <g class="ear-l">
      <path d="M50 78 L40 32 Q44 26 53 30 L82 54 Z" fill="url(#patchGrad)" stroke="#3d210d" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M49 71 L45 42 L68 57 Z" fill="#ff9ebb"/>
      <path d="M48 55 L58 62" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Right Ear (Cream White Fur) -->
    <g class="ear-r">
      <path d="M142 78 L152 32 Q148 26 139 30 L110 54 Z" fill="url(#furGrad)" stroke="#3d210d" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M143 71 L147 42 L124 57 Z" fill="#ff9ebb"/>
      <path d="M144 55 L134 62" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Head Body -->
    <ellipse cx="96" cy="100" rx="60" ry="49" fill="url(#furGrad)" stroke="#3d210d" stroke-width="2.6"/>

    <!-- Calico Eye Patch (Clipped to Head) -->
    <g clip-path="url(#headClip)">
      <path d="M38 88 C36 62 60 54 82 50 C96 48 104 56 88 75 C72 94 66 110 50 112 C40 113 37 99 38 88 Z" fill="url(#patchGrad)"/>
      <circle cx="48" cy="64" r="8" fill="#d97724" opacity="0.3"/>
    </g>

    <!-- Cheek Whiskers (Curved, Smooth) -->
    <g stroke="#3d210d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M44 102 C30 99 20 98 14 99"/>
      <path d="M44 109 C31 110 21 114 16 118"/>
      <path d="M148 102 C162 99 172 98 178 99"/>
      <path d="M148 109 C161 110 171 114 176 118"/>
    </g>

    <!-- Rosy Cheeks -->
    <ellipse cx="48" cy="116" rx="9" ry="6" fill="#ff708f" opacity="0.75"/>
    <ellipse cx="144" cy="116" rx="9" ry="6" fill="#ff708f" opacity="0.75"/>

    <!-- Eyes (Big Kawaii Expressive with Animated Blink) -->
    <g class="blink-eye">
      <!-- Sclera / Base -->
      <circle cx="68" cy="98" r="13" fill="#18110b"/>
      <circle cx="124" cy="98" r="13" fill="#18110b"/>
      <!-- Vibrant Cyan Ring Highlights in Eye -->
      <circle cx="68" cy="98" r="11" fill="none" stroke="#00f5a0" stroke-width="1.2" opacity="0.6"/>
      <circle cx="124" cy="98" r="11" fill="none" stroke="#00d2ff" stroke-width="1.2" opacity="0.6"/>
      <!-- Sparkle Highlights -->
      <circle cx="64" cy="93" r="4.8" fill="#ffffff"/>
      <circle cx="72" cy="102" r="2.2" fill="#ffffff"/>
      <circle cx="120" cy="93" r="4.8" fill="#ffffff"/>
      <circle cx="128" cy="102" r="2.2" fill="#ffffff"/>
    </g>

    <!-- Developer Glasses (Iconic Electric Cyan / Indigo Frames) -->
    <g filter="url(#neonGlow)">
      <!-- Left Lens -->
      <circle cx="68" cy="98" r="22.5" fill="url(#lensHolo)" stroke="#00d2ff" stroke-width="3.8"/>
      <!-- Right Lens -->
      <circle cx="124" cy="98" r="22.5" fill="url(#lensHolo)" stroke="#00d2ff" stroke-width="3.8"/>
      <!-- Bridge & Temples -->
      <path d="M90.5 97 Q96 93 101.5 97 M45.5 96 L37 92 M146.5 96 L155 92" fill="none" stroke="#00d2ff" stroke-width="3.8" stroke-linecap="round"/>
    </g>

    <!-- Moving Lens Gleam Reflections -->
    <g clip-path="url(#leftLensClip)">
      <g class="gleam-effect" transform="translate(68, 98)">
        <rect x="-8" y="-30" width="14" height="60" fill="#ffffff" opacity="0.55" transform="rotate(25)"/>
      </g>
    </g>
    <g clip-path="url(#rightLensClip)">
      <g class="gleam-effect" transform="translate(124, 98)">
        <rect x="-8" y="-30" width="14" height="60" fill="#ffffff" opacity="0.55" transform="rotate(25)"/>
      </g>
    </g>

    <!-- Cute Nose & Mouth -->
    <path d="M92 112 H100 L96 117 Z" fill="#f43f5e"/>
    <path d="M96 117 C92 123 85 122 83 118 M96 117 C100 123 107 122 109 118" fill="none" stroke="#3d210d" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Ahoge (Cute Antenna Hair Tuft) -->
    <path d="M96 52 C90 30 108 30 104 43" fill="none" stroke="#3d210d" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Developer Collar & Red Bowtie with Glowing Jewel -->
    <path d="M96 148 L80 140 V156 Z" fill="#ef4444"/>
    <path d="M96 148 L112 140 V156 Z" fill="#ef4444"/>
    <circle cx="96" cy="148" r="5" fill="#b91c1c"/>
    <circle cx="96" cy="148" r="2.5" fill="#00f5a0" filter="url(#starGlow)"/>

    <!-- Paws Peeking over Bottom -->
    <ellipse cx="60" cy="154" rx="14" ry="9" fill="url(#furGrad)" stroke="#3d210d" stroke-width="2.2"/>
    <ellipse cx="132" cy="154" rx="14" ry="9" fill="url(#furGrad)" stroke="#3d210d" stroke-width="2.2"/>
    <!-- Cute Toe Pads -->
    <circle cx="56" cy="154" r="2" fill="#ff9ebb"/>
    <circle cx="60" cy="152" r="2" fill="#ff9ebb"/>
    <circle cx="64" cy="154" r="2" fill="#ff9ebb"/>
    <circle cx="128" cy="154" r="2" fill="#ff9ebb"/>
    <circle cx="132" cy="152" r="2" fill="#ff9ebb"/>
    <circle cx="136" cy="154" r="2" fill="#ff9ebb"/>
  </g>
</svg>
