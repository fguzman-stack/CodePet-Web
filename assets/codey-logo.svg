<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">CodePet Logo</title>
  <desc id="desc">Codey, el gato programador con gafas redondas azules en un marco de terminal de alta tecnología con gradiente menta y violeta cósmico.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1e24"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#281745"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <radialGradient id="furGrad" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff5ea"/>
      <stop offset="100%" stop-color="#f0dac0"/>
    </radialGradient>
    <radialGradient id="patchGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f5af64"/>
      <stop offset="60%" stop-color="#d48232"/>
      <stop offset="100%" stop-color="#a65d1b"/>
    </radialGradient>
    <linearGradient id="lensGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatPet {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes earLeft {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(1deg); }
      }
      @keyframes earRight {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(3deg); }
        80% { transform: rotate(-2deg); }
      }
      @keyframes glassesGleam {
        0%, 80%, 100% { opacity: 0.15; transform: translateX(-15px) rotate(25deg); }
        40% { opacity: 0.85; transform: translateX(18px) rotate(25deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }
      @keyframes sparkle {
        0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
        50% { transform: scale(1.15) rotate(90deg); opacity: 1; }
      }
      .anim-body { animation: floatPet 4s ease-in-out infinite; }
      .anim-ear-l { transform-origin: 55px 75px; animation: earLeft 5s ease-in-out infinite; }
      .anim-ear-r { transform-origin: 137px 75px; animation: earRight 4.5s ease-in-out infinite; }
      .anim-gleam { animation: glassesGleam 6s ease-in-out infinite; }
      .anim-border { animation: pulseGlow 3s ease-in-out infinite; }
      .anim-sparkle { transform-origin: center; animation: sparkle 3s ease-in-out infinite; }
      .anim-sparkle-delay { transform-origin: center; animation: sparkle 3s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Base Icon Card -->
  <rect x="2" y="2" width="188" height="188" rx="46" fill="url(#bgGrad)"/>
  <rect class="anim-border" x="2" y="2" width="188" height="188" rx="46" fill="none" stroke="url(#borderGrad)" stroke-width="3" filter="url(#neonPulse)"/>
  
  <!-- Subtle cyber circuit background dots & lines -->
  <g opacity="0.25" stroke="#00f5a0" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M24 35h20l12 12h18"/>
    <circle cx="74" cy="47" r="2" fill="#00f5a0"/>
    <path d="M168 150h-24l-12-12h-16"/>
    <circle cx="116" cy="138" r="2" fill="#00d2ff"/>
    <path d="M18 100l10-10h14"/>
    <circle cx="42" cy="90" r="1.5" fill="#7b2cbf"/>
  </g>

  <!-- Sparkles -->
  <g class="anim-sparkle" transform="translate(150, 42)">
    <path d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7Z" fill="#00f5a0"/>
  </g>
  <g class="anim-sparkle-delay" transform="translate(36, 148)">
    <path d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5Z" fill="#ffd166"/>
  </g>

  <!-- Terminal Brackets in Background -->
  <g font-family="Consolas, monospace" font-size="18" font-weight="900" opacity="0.3" fill="#00f5a0">
    <text x="14" y="105">&lt;</text>
    <text x="166" y="105">&gt;</text>
  </g>

  <!-- Codey the Programmer Cat -->
  <g class="anim-body">
    <!-- Left Ear (Orange Patch) -->
    <g class="anim-ear-l">
      <path d="M50 78 L42 34 Q45 28 54 32 L82 54 Z" fill="url(#patchGrad)" stroke="#4a2b13" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 72 L47 43 L68 57 Z" fill="#ff9ebb"/>
    </g>

    <!-- Right Ear (Cream Fur) -->
    <g class="anim-ear-r">
      <path d="M142 78 L150 34 Q147 28 138 32 L110 54 Z" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M142 72 L145 43 L124 57 Z" fill="#ff9ebb"/>
    </g>

    <!-- Head -->
    <ellipse cx="96" cy="100" rx="60" ry="49" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2.5"/>

    <!-- Calico Patch over Left Eye -->
    <path d="M42 86 C40 64 62 56 82 52 C94 50 102 56 88 74 C74 92 68 108 52 110 C44 111 41 98 42 86 Z" fill="url(#patchGrad)" clip-path="url(#headClip)"/>

    <!-- Cute Whiskers (smooth curves) -->
    <g stroke="#4a2b13" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M46 102 C32 99 22 98 16 99"/>
      <path d="M46 109 C33 110 23 114 18 118"/>
      <path d="M146 102 C160 99 170 98 176 99"/>
      <path d="M146 109 C159 110 169 114 174 118"/>
    </g>

    <!-- Rosy Cheeks -->
    <ellipse cx="50" cy="116" rx="8" ry="5.5" fill="#ff8da1" opacity="0.75"/>
    <ellipse cx="142" cy="116" rx="8" ry="5.5" fill="#ff8da1" opacity="0.75"/>

    <!-- Eyes (Big, expressive, joyful) -->
    <g fill="#1a120c">
      <circle cx="68" cy="98" r="13"/>
      <circle cx="124" cy="98" r="13"/>
    </g>
    <!-- Eye Highlights -->
    <g fill="#ffffff">
      <circle cx="64" cy="93" r="4.5"/>
      <circle cx="72" cy="102" r="2.2"/>
      <circle cx="120" cy="93" r="4.5"/>
      <circle cx="128" cy="102" r="2.2"/>
    </g>

    <!-- Developer Glasses (Iconic Blue Frames) -->
    <g filter="url(#softGlow)">
      <!-- Left Lens Frame -->
      <circle cx="68" cy="98" r="23" fill="url(#lensGlow)" stroke="#0284c7" stroke-width="4"/>
      <!-- Right Lens Frame -->
      <circle cx="124" cy="98" r="23" fill="url(#lensGlow)" stroke="#0284c7" stroke-width="4"/>
      <!-- Bridge & Temples -->
      <path d="M91 97 Q96 93 101 97 M45 96 L37 92 M147 96 L155 92" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Glass Reflection Streak -->
    <g class="anim-gleam">
      <path d="M56 82 L76 114 M112 82 L132 114" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Tiny Nose and Mouth -->
    <path d="M92 112 H100 L96 117 Z" fill="#f43f5e"/>
    <path d="M96 117 C92 123 86 122 84 119 M96 117 C100 123 106 122 108 119" fill="none" stroke="#4a2b13" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Ahoge / Cute Antenna Cowlick -->
    <path d="M96 52 C91 32 106 32 104 43" fill="none" stroke="#4a2b13" stroke-width="4" stroke-linecap="round"/>

    <!-- Programmer Bowtie / Collar at Bottom -->
    <path d="M96 148 L80 140 V156 Z" fill="#ef4444"/>
    <path d="M96 148 L112 140 V156 Z" fill="#ef4444"/>
    <circle cx="96" cy="148" r="5" fill="#dc2626"/>
    <circle cx="96" cy="148" r="2" fill="#ffd166"/>

    <!-- Paws resting at bottom edge -->
    <ellipse cx="62" cy="154" rx="13" ry="9" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2"/>
    <ellipse cx="130" cy="154" rx="13" ry="9" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2"/>
  </g>
</svg>
