<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">Descargar APK</title>
  <desc id="desc">Botón animado estilo terminal cyberpunk para descargar la APK de Android.</desc>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091b15"/>
      <stop offset="100%" stop-color="#142c22"/>
    </linearGradient>
    <linearGradient id="neonMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes bounceArrow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }
      .anim-arrow { animation: bounceArrow 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Button Surface -->
  <rect x="2" y="2" width="276" height="60" rx="18" fill="url(#btnBg)"/>
  <rect x="2" y="2" width="276" height="60" rx="18" fill="none" stroke="url(#neonMint)" stroke-width="2" filter="url(#btnGlow)"/>

  <!-- Left Icon Circle with animated down arrow -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="18" fill="#173d2f" stroke="#00f5a0" stroke-width="1.8"/>
    <g class="anim-arrow">
      <path d="M0 -7 V7 M-5 2 L0 7 L5 2" fill="none" stroke="#00f5a0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(64, 28)">
    <text x="0" y="0" fill="#f4fff7" font-family="Inter, sans-serif" font-size="15" font-weight="800">Descargar APK</text>
    <text x="0" y="18" fill="#88e0a8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">Android 7.0+ · v3.2.0</text>
  </g>
</svg>
