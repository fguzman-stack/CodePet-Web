<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="shotTitle shotDesc">
  <title id="shotTitle">Ver Galería de Capturas</title>
  <desc id="shotDesc">Insignia animada para explorar la galería de 7 pantallas reales de la app.</desc>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#20123c"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatShutter {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(1.1) rotate(6deg); }
      }
      .anim-shutter { transform-origin: 32px 32px; animation: floatShutter 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Button Surface -->
  <rect x="2" y="2" width="276" height="60" rx="18" fill="url(#btnBg)"/>
  <rect x="2" y="2" width="276" height="60" rx="18" fill="none" stroke="url(#neonViolet)" stroke-width="2" filter="url(#btnGlow)"/>

  <!-- Left Icon Circle with animated camera/screen icon -->
  <g class="anim-shutter">
    <circle cx="32" cy="32" r="18" fill="#261548" stroke="#7b2cbf" stroke-width="1.8"/>
    <rect x="22" y="24" width="20" height="16" rx="3.5" fill="none" stroke="#c499f5" stroke-width="2"/>
    <circle cx="35" cy="28" r="1.8" fill="#ffd166"/>
    <path d="M25 36 L29 31 L32 34 L36 29 L39 36" fill="none" stroke="#c499f5" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g transform="translate(64, 28)">
    <text x="0" y="0" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="15" font-weight="800">Ver Capturas</text>
    <text x="0" y="18" fill="#c499f5" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">7 pantallas en alta resolución</text>
  </g>
</svg>
