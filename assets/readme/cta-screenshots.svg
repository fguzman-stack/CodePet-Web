<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">Ver Capturas</title>
  <desc id="desc">Botón animado estilo terminal cyberpunk para explorar la galería de capturas.</desc>
  <defs>
    <linearGradient id="btnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#1e1338"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatShutter {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      .anim-shutter { transform-origin: center; animation: floatShutter 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Button Surface -->
  <rect x="2" y="2" width="276" height="60" rx="18" fill="url(#btnBg)"/>
  <rect x="2" y="2" width="276" height="60" rx="18" fill="none" stroke="url(#neonViolet)" stroke-width="2" filter="url(#btnGlow)"/>

  <!-- Left Icon Circle with animated camera/screen icon -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="18" fill="#241445" stroke="#7b2cbf" stroke-width="1.8"/>
    <g class="anim-shutter">
      <rect x="-9" y="-7" width="18" height="14" rx="3" fill="none" stroke="#bd93f9" stroke-width="1.8"/>
      <circle cx="3" cy="-3" r="1.5" fill="#ffd166"/>
      <path d="M-6 5 L-1 0 L2 3 L5 -1 L8 5" fill="none" stroke="#bd93f9" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Text -->
  <g transform="translate(64, 28)">
    <text x="0" y="0" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="15" font-weight="800">Ver Capturas</text>
    <text x="0" y="18" fill="#c499f5" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">7 pantallas en alta resolución</text>
  </g>
</svg>
