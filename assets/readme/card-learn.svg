<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="learnTitle learnDesc">
  <title id="learnTitle">Learn by Coding Feature</title>
  <desc id="learnDesc">Módulo de retos interactivos en 13 lenguajes con validación instantánea y ganancia de experiencia.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121c"/>
      <stop offset="60%" stop-color="#14142a"/>
      <stop offset="100%" stop-color="#1e1136"/>
    </linearGradient>

    <linearGradient id="neonPurpleCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes passPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #00f5a0); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 8px #00f5a0); }
      }

      .anim-icon { animation: floatIcon 3.5s ease-in-out infinite; }
      .anim-cursor { animation: blinkCursor 0.9s step-end infinite; }
      .anim-pass { transform-origin: center; animation: passPulse 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="220" rx="22" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="458" height="218" rx="21" fill="none" stroke="url(#neonPurpleCyan)" stroke-width="2"/>

  <!-- Module Badge & Code Icon -->
  <g class="anim-icon">
    <circle cx="52" cy="48" r="24" fill="#201438" stroke="#a855f7" stroke-width="2" filter="url(#neonGlow)"/>
    <path d="M43 42 L37 48 L43 54 M61 42 L67 48 L61 54 M55 40 L49 56" fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Module Header -->
  <g transform="translate(94, 38)">
    <rect x="0" y="-3" width="108" height="20" rx="6" fill="#201438" stroke="#a855f7" stroke-width="1" opacity="0.85"/>
    <text x="8" y="11" fill="#d8b4fe" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">MODULE.LEARN</text>
    <text x="0" y="36" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Learn By Coding</text>
  </g>

  <!-- Top Right Language Chips -->
  <g transform="translate(320, 24)">
    <rect width="52" height="18" rx="5" fill="#1b1c36" stroke="#a855f7" stroke-width="1"/>
    <text x="7" y="13" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700">KOTLIN</text>
    <rect x="58" width="44" height="18" rx="5" fill="#122a2e" stroke="#00d2ff" stroke-width="1"/>
    <text x="66" y="13" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700">RUST</text>
  </g>

  <!-- Bullets and Code Editor -->
  <g transform="translate(34, 114)">
    <!-- Bullet 1 -->
    <circle cx="6" cy="6" r="3.5" fill="#a855f7"/>
    <text x="18" y="10" fill="#f0fff7" font-family="Inter, sans-serif" font-size="14" font-weight="600">117 retos prácticos en 13 lenguajes</text>

    <!-- Bullet 2 -->
    <circle cx="6" cy="32" r="3.5" fill="#00d2ff"/>
    <text x="18" y="36" fill="#d2e0d8" font-family="Inter, sans-serif" font-size="14">Algoritmos interactivos + pistas progresivas</text>

    <!-- Mini IDE Terminal Snippet Bar -->
    <g transform="translate(18, 54)">
      <rect width="250" height="24" rx="6" fill="#0d1624" stroke="#1f364d" stroke-width="1.2"/>
      <text x="10" y="16" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11">val pass = solve(challenge)</text>
      <rect class="anim-cursor" x="208" y="6" width="6" height="12" fill="#00f5a0"/>
    </g>

    <!-- Success Badge -->
    <g class="anim-pass" transform="translate(300, 52)">
      <rect width="102" height="24" rx="8" fill="#112920" stroke="#00f5a0" stroke-width="1.2"/>
      <path d="M10 12 L14 16 L22 8" fill="none" stroke="#00f5a0" stroke-width="2" stroke-linecap="round"/>
      <text x="28" y="16" fill="#00f5a0" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">+50 XP PASS</text>
    </g>
  </g>
</svg>
