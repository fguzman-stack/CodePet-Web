<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="title desc">
  <title id="title">Learn by Coding Feature</title>
  <desc id="desc">Módulo de retos de programación interactivos con 13 lenguajes y algoritmos.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#18112c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .anim-icon { animation: floatIcon 3.5s ease-in-out infinite; }
      .anim-cursor { animation: blinkCursor 1s step-end infinite; }
    </style>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="220" rx="22" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="458" height="218" rx="21" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- Module Badge & Code Icon -->
  <g class="anim-icon">
    <circle cx="52" cy="48" r="24" fill="#201538" stroke="#7b2cbf" stroke-width="2" filter="url(#cardGlow)"/>
    <path d="M44 42 L38 48 L44 54 M60 42 L66 48 L60 54 M54 40 L50 56" fill="none" stroke="#bd93f9" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g transform="translate(94, 38)">
    <rect x="0" y="-3" width="108" height="20" rx="6" fill="#201538" stroke="#7b2cbf" stroke-width="1" opacity="0.8"/>
    <text x="8" y="11" fill="#c499f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">MODULE.LEARN</text>
    <text x="0" y="36" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Learn By Coding</text>
  </g>

  <!-- Subtitle and bullets -->
  <g transform="translate(34, 112)">
    <!-- Bullet 1 -->
    <circle cx="6" cy="6" r="3" fill="#7b2cbf"/>
    <text x="18" y="10" fill="#effff5" font-family="Inter, sans-serif" font-size="14" font-weight="600">117 retos prácticos en 13 lenguajes</text>

    <!-- Bullet 2 -->
    <circle cx="6" cy="32" r="3" fill="#00d2ff"/>
    <text x="18" y="36" fill="#d2e0d8" font-family="Inter, sans-serif" font-size="14">Algoritmos especiales + revisión interactiva</text>

    <!-- Code Snippet Bar -->
    <g transform="translate(18, 54)">
      <rect width="250" height="22" rx="6" fill="#0f1724" stroke="#1d3047" stroke-width="1"/>
      <text x="10" y="15" fill="#00d2ff" font-family="JetBrains Mono, monospace" font-size="11">val pass = solve(challenge)</text>
      <rect class="anim-cursor" x="205" y="5" width="7" height="12" fill="#00f5a0"/>
    </g>

    <!-- Footer tagline -->
    <text x="0" y="98" fill="#7fa091" font-family="JetBrains Mono, monospace" font-size="12">Cada solución te recompensa con XP real.</text>
  </g>
</svg>
