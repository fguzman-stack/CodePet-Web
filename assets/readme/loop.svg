<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-labelledby="title desc">
  <title id="title">El Ciclo CodePet</title>
  <desc id="desc">Ciclo gamificado: estudiar con Pomodoro, resolver retos, ganar XP y Bytes, cuidar a Codey y evolucionar.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f16"/>
      <stop offset="50%" stop-color="#11162e"/>
      <stop offset="100%" stop-color="#1a1130"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="30%" stop-color="#7b2cbf"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes arrowPulse {
        0% { stroke-dashoffset: 40; opacity: 0.4; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -40; opacity: 0.4; }
      }
      @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.18); }
        40% { transform: scale(1.05); }
        60% { transform: scale(1.22); }
      }
      @keyframes starRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatStep {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .flow-arrow { stroke-dasharray: 6 6; animation: arrowPulse 2s linear infinite; }
      .heart-anim { transform-origin: 24px 39px; animation: heartBeat 1.8s ease-in-out infinite; }
      .star-anim { transform-origin: 24px 39px; animation: starRotate 8s linear infinite; }
      .step-1 { animation: floatStep 4s ease-in-out infinite 0s; }
      .step-2 { animation: floatStep 4s ease-in-out infinite 0.6s; }
      .step-3 { animation: floatStep 4s ease-in-out infinite 1.2s; }
      .step-4 { animation: floatStep 4s ease-in-out infinite 1.8s; }
      .step-5 { animation: floatStep 4s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="960" height="170" rx="26" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="168" rx="25" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- Terminal Header Prompt -->
  <g transform="translate(36, 28)">
    <circle cx="0" cy="0" r="4.5" fill="#00f5a0"/>
    <text x="14" y="4" fill="#00f5a0" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">$ ./codey --loop --continuous</text>
    <text x="740" y="4" fill="#6d869c" font-family="JetBrains Mono, monospace" font-size="12">STATUS: SYNCHRONIZED</text>
  </g>

  <!-- Steps Rail -->
  <g transform="translate(36, 56)">
    <!-- STEP 1: STUDY (Pomodoro) -->
    <g transform="translate(0, 0)">
      <g class="step-1">
        <rect width="144" height="78" rx="18" fill="#0e1a24" stroke="#00f5a0" stroke-width="1.8" filter="url(#softGlow)"/>
        <!-- Icon: Timer -->
        <g transform="translate(24, 39)">
          <circle cx="0" cy="0" r="14" fill="#132e22" stroke="#00f5a0" stroke-width="2"/>
          <line x1="0" y1="0" x2="0" y2="-8" stroke="#00f5a0" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="6" y2="4" stroke="#00f5a0" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="50" y="34" fill="#a4e4be" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">01. FOCUS</text>
        <text x="50" y="54" fill="#f4fff7" font-family="Inter, sans-serif" font-size="16" font-weight="800">STUDY</text>
      </g>
    </g>

    <!-- Connector 1 -->
    <g transform="translate(148, 39)">
      <line class="flow-arrow" x1="0" y1="0" x2="36" y2="0" stroke="#7b2cbf" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="36,0 30,-5 30,5" fill="#7b2cbf"/>
    </g>

    <!-- STEP 2: SOLVE (Code challenge) -->
    <g transform="translate(190, 0)">
      <g class="step-2">
        <rect width="144" height="78" rx="18" fill="#15132d" stroke="#7b2cbf" stroke-width="1.8" filter="url(#softGlow)"/>
        <!-- Icon: </> -->
        <g transform="translate(24, 39)">
          <circle cx="0" cy="0" r="14" fill="#241845" stroke="#7b2cbf" stroke-width="2"/>
          <path d="M-6-4 L-10 0 L-6 4 M6-4 L10 0 L6 4 M2-6 L-2 6" fill="none" stroke="#bd93f9" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <text x="50" y="34" fill="#cbb4f8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">02. KOTLIN</text>
        <text x="50" y="54" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="16" font-weight="800">SOLVE</text>
      </g>
    </g>

    <!-- Connector 2 -->
    <g transform="translate(338, 39)">
      <line class="flow-arrow" x1="0" y1="0" x2="36" y2="0" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="36,0 30,-5 30,5" fill="#00d2ff"/>
    </g>

    <!-- STEP 3: EARN (XP & Bytes) -->
    <g transform="translate(380, 0)">
      <g class="step-3">
        <rect width="144" height="78" rx="18" fill="#1b1c18" stroke="#ffd166" stroke-width="1.8" filter="url(#softGlow)"/>
        <!-- Icon: Coin / XP -->
        <g transform="translate(24, 39)">
          <circle cx="0" cy="0" r="14" fill="#332c12" stroke="#ffd166" stroke-width="2"/>
          <text x="0" y="5" text-anchor="middle" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="13" font-weight="900">₿</text>
        </g>
        <text x="50" y="34" fill="#f5df9a" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">03. REWARDS</text>
        <text x="50" y="54" fill="#fffbe6" font-family="Inter, sans-serif" font-size="16" font-weight="800">EARN</text>
      </g>
    </g>

    <!-- Connector 3 -->
    <g transform="translate(528, 39)">
      <line class="flow-arrow" x1="0" y1="0" x2="36" y2="0" stroke="#ff5f7e" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="36,0 30,-5 30,5" fill="#ff5f7e"/>
    </g>

    <!-- STEP 4: CARE (Feed & Pet) -->
    <g transform="translate(570, 0)">
      <g class="step-4">
        <rect width="144" height="78" rx="18" fill="#24131b" stroke="#ff5f7e" stroke-width="1.8" filter="url(#softGlow)"/>
        <!-- Icon: Beating Heart -->
        <g class="heart-anim">
          <circle cx="24" cy="39" r="14" fill="#421a28" stroke="#ff5f7e" stroke-width="2"/>
          <path d="M24 43 L19 37 C16 33 21 29 24 33 C27 29 32 33 29 37 Z" fill="#ff5f7e"/>
        </g>
        <text x="50" y="34" fill="#ffb4c3" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">04. CODEY</text>
        <text x="50" y="54" fill="#fff2f5" font-family="Inter, sans-serif" font-size="16" font-weight="800">CARE</text>
      </g>
    </g>

    <!-- Connector 4 -->
    <g transform="translate(718, 39)">
      <line class="flow-arrow" x1="0" y1="0" x2="36" y2="0" stroke="#00f5a0" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="36,0 30,-5 30,5" fill="#00f5a0"/>
    </g>

    <!-- STEP 5: EVOLVE (Unlock & Level UP) -->
    <g transform="translate(760, 0)">
      <g class="step-5">
        <rect width="128" height="78" rx="18" fill="#0c1e28" stroke="#00f5a0" stroke-width="1.8" filter="url(#softGlow)"/>
        <!-- Icon: Spinning Star -->
        <g class="star-anim">
          <polygon points="24,27 28,35 36,39 28,43 24,51 20,43 12,39 20,35" fill="#00f5a0"/>
        </g>
        <text x="46" y="34" fill="#99f7ce" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">05. LEVEL</text>
        <text x="46" y="54" fill="#f0fff8" font-family="Inter, sans-serif" font-size="16" font-weight="800">EVOLVE++</text>
      </g>
    </g>
  </g>
</svg>
