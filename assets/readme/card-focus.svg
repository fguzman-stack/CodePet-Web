<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="focusTitle focusDesc">
  <title id="focusTitle">Focus Rewards Feature</title>
  <desc id="focusDesc">Módulo de productividad Pomodoro con temporizador circular y recompensas en Bytes para Codey.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091520"/>
      <stop offset="60%" stop-color="#0e1d24"/>
      <stop offset="100%" stop-color="#0a241e"/>
    </linearGradient>

    <linearGradient id="neonCyanMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes handRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes colonBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      @keyframes waveBar1 { 0%, 100% { height: 4px; } 50% { height: 16px; } }
      @keyframes waveBar2 { 0%, 100% { height: 14px; } 50% { height: 6px; } }
      @keyframes waveBar3 { 0%, 100% { height: 8px; } 50% { height: 18px; } }

      .anim-hand { transform-origin: 52px 48px; animation: handRotate 10s linear infinite; }
      .anim-colon { animation: colonBlink 1s step-end infinite; }
      .anim-wb-1 { animation: waveBar1 1.2s ease-in-out infinite; }
      .anim-wb-2 { animation: waveBar2 1.4s ease-in-out infinite; }
      .anim-wb-3 { animation: waveBar3 1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="220" rx="22" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="458" height="218" rx="21" fill="none" stroke="url(#neonCyanMint)" stroke-width="2"/>

  <!-- Module Badge & Focus Chronometer Icon -->
  <g>
    <circle cx="52" cy="48" r="24" fill="#0f2b38" stroke="#00d2ff" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Outer dashed markers -->
    <circle cx="52" cy="48" r="19" fill="none" stroke="#00f5a0" stroke-width="1.5" stroke-dasharray="3 5"/>
    <!-- Rotating Chrono Hand -->
    <g class="anim-hand">
      <line x1="52" y1="48" x2="52" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <line x1="52" y1="48" x2="63" y2="48" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="52" cy="48" r="3.2" fill="#00f5a0"/>
  </g>

  <!-- Module Header -->
  <g transform="translate(94, 38)">
    <rect x="0" y="-3" width="108" height="20" rx="6" fill="#0f2b38" stroke="#00d2ff" stroke-width="1" opacity="0.85"/>
    <text x="8" y="11" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">MODULE.FOCUS</text>
    <text x="0" y="36" fill="#f0fbff" font-family="Inter, sans-serif" font-size="22" font-weight="800">Focus Rewards</text>
  </g>

  <!-- Top Right Digital Timer Display: 25:00 -->
  <g transform="translate(330, 26)">
    <rect width="84" height="26" rx="8" fill="#0b221d" stroke="#00f5a0" stroke-width="1.2"/>
    <text x="14" y="18" fill="#00f5a0" font-family="JetBrains Mono, monospace" font-size="14" font-weight="900">25<tspan class="anim-colon">:</tspan>00</text>
  </g>

  <!-- Bullets and Session Modes -->
  <g transform="translate(34, 114)">
    <!-- Bullet 1 -->
    <circle cx="6" cy="6" r="3.5" fill="#00d2ff"/>
    <text x="18" y="10" fill="#f0fff7" font-family="Inter, sans-serif" font-size="14" font-weight="600">Sesiones Pomodoro de 15, 25 y 50 minutos</text>

    <!-- Bullet 2 -->
    <circle cx="6" cy="32" r="3.5" fill="#00f5a0"/>
    <text x="18" y="36" fill="#d2e0d8" font-family="Inter, sans-serif" font-size="14">Gana XP + Bytes por cada bloque de estudio</text>

    <!-- Session Chips -->
    <g transform="translate(18, 54)">
      <rect width="54" height="24" rx="7" fill="#112d38" stroke="#00d2ff" stroke-width="1.2"/>
      <text x="14" y="16" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">15m</text>

      <rect x="64" width="54" height="24" rx="7" fill="#13382c" stroke="#00f5a0" stroke-width="1.5"/>
      <text x="78" y="16" fill="#00f5a0" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800">25m</text>

      <rect x="128" width="54" height="24" rx="7" fill="#281d38" stroke="#a855f7" stroke-width="1.2"/>
      <text x="142" y="16" fill="#d8b4fe" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">50m</text>
    </g>

    <!-- Ambient Binaural Frequency Waves -->
    <g transform="translate(310, 66)">
      <rect class="anim-wb-1" x="0" y="-12" width="3.5" height="12" rx="1.5" fill="#00f5a0"/>
      <rect class="anim-wb-2" x="6" y="-12" width="3.5" height="12" rx="1.5" fill="#00d2ff"/>
      <rect class="anim-wb-3" x="12" y="-12" width="3.5" height="12" rx="1.5" fill="#ffd166"/>
      <rect class="anim-wb-1" x="18" y="-12" width="3.5" height="12" rx="1.5" fill="#00f5a0"/>
      <text x="28" y="-2" fill="#73a992" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">DEEP FLOW</text>
    </g>
  </g>
</svg>
