<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">CodePet System Metrics &amp; Stats</title>
  <desc id="desc">Panel de estadísticas del sistema: versión 3.2.0, compatibilidad Android API 24+, retos y temas disponibles.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080f16"/>
      <stop offset="50%" stop-color="#0d1822"/>
      <stop offset="100%" stop-color="#141126"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes eqBar1 { 0%, 100% { height: 6px; } 50% { height: 18px; } }
      @keyframes eqBar2 { 0%, 100% { height: 16px; } 50% { height: 8px; } }
      @keyframes eqBar3 { 0%, 100% { height: 10px; } 50% { height: 22px; } }
      @keyframes ledPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; filter: drop-shadow(0 0 4px #00f5a0); } }

      .anim-eq-1 { animation: eqBar1 1.2s ease-in-out infinite; }
      .anim-eq-2 { animation: eqBar2 1.5s ease-in-out infinite; }
      .anim-eq-3 { animation: eqBar3 1.1s ease-in-out infinite; }
      .anim-led { animation: ledPulse 2s infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="960" height="180" rx="26" fill="url(#panelBg)"/>
  <rect x="1" y="1" width="958" height="178" rx="25" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- Top Terminal Header -->
  <g transform="translate(36, 28)">
    <circle class="anim-led" cx="0" cy="0" r="4.5" fill="#00f5a0"/>
    <text x="14" y="4" fill="#00f5a0" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">$ ./codey --telemetry --stats --verified</text>
    
    <!-- Equalizer visualization -->
    <g transform="translate(760, 4)">
      <rect class="anim-eq-1" x="0" y="-14" width="4" height="14" rx="2" fill="#00f5a0"/>
      <rect class="anim-eq-2" x="8" y="-14" width="4" height="14" rx="2" fill="#00d2ff"/>
      <rect class="anim-eq-3" x="16" y="-14" width="4" height="14" rx="2" fill="#7b2cbf"/>
      <rect class="anim-eq-1" x="24" y="-14" width="4" height="14" rx="2" fill="#ffd166"/>
      <text x="36" y="0" fill="#6d869c" font-family="JetBrains Mono, monospace" font-size="11">SYSTEM HEALTH: 100%</text>
    </g>
  </g>

  <!-- Stats Grid Metrics -->
  <g transform="translate(36, 68)">
    <!-- Metric 1: Version -->
    <g transform="translate(0, 0)">
      <text y="24" fill="#00f5a0" font-family="Inter, sans-serif" font-size="32" font-weight="900">3.2.0</text>
      <text y="48" fill="#7ba3bc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">APP VERSION</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">BUILD PRODUCTION</text>
    </g>

    <!-- Divider -->
    <line x1="126" y1="5" x2="126" y2="60" stroke="#1c2e3c" stroke-width="1.5"/>

    <!-- Metric 2: Android -->
    <g transform="translate(148, 0)">
      <text y="24" fill="#00d2ff" font-family="Inter, sans-serif" font-size="32" font-weight="900">API 24+</text>
      <text y="48" fill="#7ba3bc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">ANDROID 7.0+</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">MIN COMPATIBLE</text>
    </g>

    <!-- Divider -->
    <line x1="288" y1="5" x2="288" y2="60" stroke="#1c2e3c" stroke-width="1.5"/>

    <!-- Metric 3: Challenges -->
    <g transform="translate(310, 0)">
      <text y="24" fill="#f8f4ff" font-family="Inter, sans-serif" font-size="32" font-weight="900">123</text>
      <text y="48" fill="#c499f5" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">RETOS TOTALES</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">117 REG + 6 SPEC</text>
    </g>

    <!-- Divider -->
    <line x1="450" y1="5" x2="450" y2="60" stroke="#1c2e3c" stroke-width="1.5"/>

    <!-- Metric 4: Languages -->
    <g transform="translate(472, 0)">
      <text y="24" fill="#ffd166" font-family="Inter, sans-serif" font-size="32" font-weight="900">13</text>
      <text y="48" fill="#e0cb8d" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">LENGUAJES</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">MULTI-SINTAXIS</text>
    </g>

    <!-- Divider -->
    <line x1="592" y1="5" x2="592" y2="60" stroke="#1c2e3c" stroke-width="1.5"/>

    <!-- Metric 5: Themes -->
    <g transform="translate(614, 0)">
      <text y="24" fill="#ff79c6" font-family="Inter, sans-serif" font-size="32" font-weight="900">12+</text>
      <text y="48" fill="#e499c7" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">TEMAS VISUALES</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">CUSTOMIZACIÓN</text>
    </g>

    <!-- Divider -->
    <line x1="740" y1="5" x2="740" y2="60" stroke="#1c2e3c" stroke-width="1.5"/>

    <!-- Metric 6: Room Schema -->
    <g transform="translate(762, 0)">
      <text y="24" fill="#50fa7b" font-family="Inter, sans-serif" font-size="32" font-weight="900">Room 7</text>
      <text y="48" fill="#88e0a0" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">LOCAL SQLITE</text>
      <text y="62" fill="#4a6579" font-family="JetBrains Mono, monospace" font-size="9">DATA MIGRATION OK</text>
    </g>
  </g>

  <!-- Bottom Details Line -->
  <g transform="translate(36, 154)">
    <circle cx="0" cy="0" r="3" fill="#00f5a0"/>
    <text x="12" y="3" fill="#a4bed0" font-family="JetBrains Mono, monospace" font-size="11">Todos los retos, assets y bases de datos están empaquetados localmente dentro de la APK (0 peticiones a servidores externos).</text>
  </g>
</svg>
