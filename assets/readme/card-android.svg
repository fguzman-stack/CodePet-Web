<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220" role="img" aria-labelledby="droidTitle droidDesc">
  <title id="droidTitle">Native Android Systems Feature</title>
  <desc id="droidDesc">Módulo de arquitectura Android 100% nativa y offline: Jetpack Compose, Room v7 y DataStore.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a141a"/>
      <stop offset="60%" stop-color="#141c14"/>
      <stop offset="100%" stop-color="#1c190f"/>
    </linearGradient>

    <linearGradient id="neonGreenAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="50%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes droidBlink {
        0%, 94%, 100% { opacity: 1; }
        97% { opacity: 0; }
      }
      @keyframes radarWave {
        0% { r: 3px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes floatChip {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .anim-eyes { animation: droidBlink 4.2s infinite; }
      .anim-radar { transform-origin: 395px 36px; animation: radarWave 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .anim-chip { animation: floatChip 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Body -->
  <rect width="460" height="220" rx="22" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="458" height="218" rx="21" fill="none" stroke="url(#neonGreenAmber)" stroke-width="2"/>

  <!-- Module Badge & Android Head Icon -->
  <g class="anim-chip">
    <circle cx="52" cy="48" r="24" fill="#142e1d" stroke="#3ddc84" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Android Head -->
    <path d="M40 54 A12 12 0 0 1 64 54 Z" fill="#3ddc84"/>
    <!-- Antennas -->
    <line x1="43" y1="44" x2="38" y2="38" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="61" y1="44" x2="66" y2="38" stroke="#3ddc84" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Android Eyes with Blink -->
    <g class="anim-eyes">
      <circle cx="47" cy="48" r="1.8" fill="#091410"/>
      <circle cx="57" cy="48" r="1.8" fill="#091410"/>
    </g>
  </g>

  <!-- Module Header -->
  <g transform="translate(94, 38)">
    <rect x="0" y="-3" width="124" height="20" rx="6" fill="#142e1d" stroke="#3ddc84" stroke-width="1" opacity="0.85"/>
    <text x="8" y="11" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">MODULE.ANDROID</text>
    <text x="0" y="36" fill="#f2fff6" font-family="Inter, sans-serif" font-size="22" font-weight="800">Native Systems</text>
  </g>

  <!-- Offline Radar Signal Badge -->
  <g transform="translate(395, 36)">
    <circle class="anim-radar" cx="0" cy="0" r="4" fill="none" stroke="#3ddc84" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#3ddc84"/>
  </g>
  <text x="348" y="40" fill="#86efac" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">100% LOCAL</text>

  <!-- Bullets and Tech Stack -->
  <g transform="translate(34, 114)">
    <!-- Bullet 1 -->
    <circle cx="6" cy="6" r="3.5" fill="#3ddc84"/>
    <text x="18" y="10" fill="#f0fff7" font-family="Inter, sans-serif" font-size="14" font-weight="600">Room v7, DataStore &amp; WorkManager</text>

    <!-- Bullet 2 -->
    <circle cx="6" cy="32" r="3.5" fill="#ffd166"/>
    <text x="18" y="36" fill="#d2e0d8" font-family="Inter, sans-serif" font-size="14">Compose Canvas reactivo + Widget de escritorio</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(18, 54)">
      <rect width="70" height="24" rx="7" fill="#123321" stroke="#3ddc84" stroke-width="1.2"/>
      <text x="10" y="16" fill="#3ddc84" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">COMPOSE</text>

      <rect x="80" width="60" height="24" rx="7" fill="#2d2510" stroke="#ffd166" stroke-width="1.2"/>
      <text x="88" y="16" fill="#ffd166" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">ROOM 7</text>

      <rect x="150" width="84" height="24" rx="7" fill="#1a1836" stroke="#a855f7" stroke-width="1.2"/>
      <text x="158" y="16" fill="#d8b4fe" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">DATASTORE</text>

      <rect x="244" width="76" height="24" rx="7" fill="#112932" stroke="#00d2ff" stroke-width="1.2"/>
      <text x="252" y="16" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">WIDGET ✦</text>
    </g>
  </g>
</svg>
