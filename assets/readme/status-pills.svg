<svg xmlns="http://www.w3.org/2000/svg" width="760" height="78" viewBox="0 0 760 78" role="img" aria-labelledby="statusTitle statusDesc">
  <title id="statusTitle">CodePet Project Badges</title>
  <desc id="statusDesc">Badges animadas del proyecto: Local First, Licencia MIT, Android 7+, Kotlin 2.0 y Jetpack Compose.</desc>
  <defs>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="35%" stop-color="#7b2cbf"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dotPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .anim-dot { transform-origin: center; animation: dotPulse 2s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="760" height="78" rx="22" fill="#091119"/>
  <rect x="1" y="1" width="758" height="76" rx="21" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- Badges Grid -->
  <g transform="translate(18, 20)">
    <!-- Pill 1: 100% Local First (Replaced dead APK release) -->
    <g transform="translate(0, 0)">
      <rect width="146" height="38" rx="14" fill="#0f261b" stroke="#00f5a0" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="20" cy="19" r="4" fill="#00f5a0"/>
      <text x="32" y="24" font-size="11.5" fill="#c9ffd4" font-family="JetBrains Mono, monospace" font-weight="800">100% LOCAL-FIRST</text>
    </g>

    <!-- Pill 2: MIT -->
    <g transform="translate(156, 0)">
      <rect width="112" height="38" rx="14" fill="#1b1433" stroke="#7b2cbf" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="20" cy="19" r="4" fill="#bd93f9"/>
      <text x="32" y="24" font-size="11.5" fill="#ebdfff" font-family="JetBrains Mono, monospace" font-weight="800">MIT LICENSE</text>
    </g>

    <!-- Pill 3: Android 7+ -->
    <g transform="translate(278, 0)">
      <rect width="134" height="38" rx="14" fill="#0e2319" stroke="#3ddc84" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="20" cy="19" r="4" fill="#3ddc84"/>
      <text x="32" y="24" font-size="11.5" fill="#b9f8d1" font-family="JetBrains Mono, monospace" font-weight="800">ANDROID 7+</text>
    </g>

    <!-- Pill 4: Kotlin -->
    <g transform="translate(422, 0)">
      <rect width="136" height="38" rx="14" fill="#1d1538" stroke="#7b2cbf" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="20" cy="19" r="4" fill="#ff79c6"/>
      <text x="32" y="24" font-size="11.5" fill="#f4e0ff" font-family="JetBrains Mono, monospace" font-weight="800">KOTLIN 2.0</text>
    </g>

    <!-- Pill 5: Compose UI -->
    <g transform="translate(568, 0)">
      <rect width="156" height="38" rx="14" fill="#0d2134" stroke="#00d2ff" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="20" cy="19" r="4" fill="#00d2ff"/>
      <text x="32" y="24" font-size="11.5" fill="#d2f2ff" font-family="JetBrains Mono, monospace" font-weight="800">JETPACK COMPOSE</text>
    </g>
  </g>
</svg>
