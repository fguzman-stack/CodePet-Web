<svg xmlns="http://www.w3.org/2000/svg" width="760" height="78" viewBox="0 0 760 78" role="img" aria-labelledby="title desc">
  <title id="title">CodePet Project Badges</title>
  <desc id="desc">Badges animadas del proyecto: APK READY, Licencia MIT, Android 7+, Kotlin y Jetpack Compose.</desc>
  <defs>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="35%" stop-color="#7b2cbf"/>
      <stop offset="70%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes dotPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes sheenSweep {
        0% { transform: translateX(-100px); }
        100% { transform: translateX(800px); }
      }
      .anim-dot { transform-origin: center; animation: dotPulse 2s infinite ease-in-out; }
      .anim-sheen { animation: sheenSweep 4s linear infinite; }
    </style>
  </defs>

  <rect width="760" height="78" rx="22" fill="#091119"/>
  <rect x="1" y="1" width="758" height="76" rx="21" fill="none" stroke="url(#edgeGrad)" stroke-width="2"/>

  <!-- Badges Grid -->
  <g transform="translate(20, 20)">
    <!-- Pill 1: APK Ready -->
    <g transform="translate(0, 0)">
      <rect width="132" height="38" rx="14" fill="#0f261b" stroke="#00f5a0" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="22" cy="19" r="4" fill="#00f5a0"/>
      <text x="36" y="24" font-size="12" fill="#c9ffd4" font-family="JetBrains Mono, monospace" font-weight="800">APK READY</text>
    </g>

    <!-- Pill 2: MIT -->
    <g transform="translate(144, 0)">
      <rect width="108" height="38" rx="14" fill="#1b1433" stroke="#7b2cbf" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="22" cy="19" r="4" fill="#bd93f9"/>
      <text x="36" y="24" font-size="12" fill="#ebdfff" font-family="JetBrains Mono, monospace" font-weight="800">MIT LICENSE</text>
    </g>

    <!-- Pill 3: Android 7+ -->
    <g transform="translate(264, 0)">
      <rect width="134" height="38" rx="14" fill="#0e2319" stroke="#3ddc84" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="22" cy="19" r="4" fill="#3ddc84"/>
      <text x="36" y="24" font-size="12" fill="#b9f8d1" font-family="JetBrains Mono, monospace" font-weight="800">ANDROID 7+</text>
    </g>

    <!-- Pill 4: Kotlin -->
    <g transform="translate(410, 0)">
      <rect width="136" height="38" rx="14" fill="#1d1538" stroke="#7b2cbf" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="22" cy="19" r="4" fill="#ff79c6"/>
      <text x="36" y="24" font-size="12" fill="#f4e0ff" font-family="JetBrains Mono, monospace" font-weight="800">KOTLIN 2.0</text>
    </g>

    <!-- Pill 5: Compose UI -->
    <g transform="translate(558, 0)">
      <rect width="162" height="38" rx="14" fill="#0d2134" stroke="#00d2ff" stroke-width="1.5" filter="url(#glow)"/>
      <circle class="anim-dot" cx="22" cy="19" r="4" fill="#00d2ff"/>
      <text x="36" y="24" font-size="12" fill="#d2f2ff" font-family="JetBrains Mono, monospace" font-weight="800">JETPACK COMPOSE</text>
    </g>
  </g>
</svg>
