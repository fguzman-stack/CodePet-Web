<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340" role="img" aria-labelledby="title desc">
  <title id="title">Codey Saludando</title>
  <desc id="desc">Codey, el gatito programador, saludando alegremente con su patita sobre una consola con luces neón.</desc>
  <defs>
    <linearGradient id="footerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1e24"/>
      <stop offset="50%" stop-color="#191535"/>
      <stop offset="100%" stop-color="#2a1444"/>
    </linearGradient>

    <radialGradient id="furGrad" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff6ed"/>
      <stop offset="100%" stop-color="#f0dac2"/>
    </radialGradient>

    <radialGradient id="patchGrad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#f6ad62"/>
      <stop offset="60%" stop-color="#d4802c"/>
      <stop offset="100%" stop-color="#a85912"/>
    </radialGradient>

    <linearGradient id="neonBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pawWave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(18deg); }
        50% { transform: rotate(-8deg); }
        75% { transform: rotate(14deg); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }
      @keyframes blinkEyes {
        0%, 96%, 100% { transform: scaleY(1); }
        98% { transform: scaleY(0.1); }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatHeart {
        0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.6; }
        50% { transform: translateY(-14px) scale(1.15); opacity: 1; }
      }
      .anim-wave { transform-origin: 0 0; animation: pawWave 2.5s ease-in-out infinite; }
      .anim-head { transform-origin: 200px 180px; animation: headTilt 4s ease-in-out infinite; }
      .anim-blink { transform-origin: 200px 145px; animation: blinkEyes 4.5s infinite; }
      .anim-badge-float { animation: floatBadge 3.5s ease-in-out infinite; }
      .anim-star { animation: starTwinkle 2s ease-in-out infinite; }
      .anim-heart-float { animation: floatHeart 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Glowing Aura behind Codey -->
  <circle cx="200" cy="180" r="140" fill="#7b2cbf" fill-opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="200" cy="190" r="110" fill="#00f5a0" fill-opacity="0.2" filter="url(#softGlow)"/>

  <!-- Holographic Floating Badge: "HELLO WORLD!" with decoupled translate -->
  <g transform="translate(40, 40)">
    <g class="anim-badge-float">
      <rect width="130" height="38" rx="14" fill="#091420" fill-opacity="0.9" stroke="#00f5a0" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="16" y="24" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#00f5a0">git push ❤</text>
    </g>
  </g>

  <!-- Twinkles -->
  <g transform="translate(340, 60)">
    <g class="anim-star">
      <path d="M 0 -8 Q 2 -2 8 0 Q 2 2 0 8 Q -2 2 -8 0 Q -2 -2 0 -8 Z" fill="#ffd166"/>
    </g>
  </g>
  <g transform="translate(60, 200)">
    <g class="anim-star" style="animation-delay: 1s;">
      <path d="M 0 -6 Q 1 -1 6 0 Q 1 1 0 6 Q -1 1 -6 0 Q -1 -1 0 -6 Z" fill="#00f5a0"/>
    </g>
  </g>

  <!-- Codey Character Group -->
  <g class="anim-head">
    <!-- Tail behind -->
    <path d="M 280 230 C 330 220 360 170 340 130 C 330 110 305 120 310 140 C 315 160 300 200 270 235" fill="url(#patchGrad)" stroke="#4a2b13" stroke-width="3" stroke-linecap="round"/>
    <circle cx="330" cy="120" r="9" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2.5"/>

    <!-- Body -->
    <ellipse cx="200" cy="245" rx="75" ry="65" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="3.5"/>
    <path d="M 160 210 C 180 210 190 230 180 270 C 150 285 130 260 140 230 Z" fill="url(#patchGrad)"/>

    <!-- Left Ear (Calico) -->
    <g>
      <path d="M 140 120 L 126 62 C 128 54 140 56 152 64 L 178 92 Z" fill="url(#patchGrad)" stroke="#4a2b13" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 140 114 L 134 76 L 164 92 Z" fill="#ff9ebb"/>
    </g>

    <!-- Right Ear (Cream) -->
    <g>
      <path d="M 260 120 L 274 62 C 272 54 260 56 248 64 L 222 92 Z" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 260 114 L 266 76 L 236 92 Z" fill="#ff9ebb"/>
    </g>

    <!-- Head -->
    <ellipse cx="200" cy="140" rx="72" ry="58" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="3.5"/>
    <path d="M 220 90 C 248 85 270 105 272 135 C 272 160 255 180 230 175 C 222 150 218 115 220 90 Z" fill="url(#patchGrad)"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="152" cy="162" rx="10" ry="7" fill="#ff708d" opacity="0.8"/>
    <ellipse cx="248" cy="162" rx="10" ry="7" fill="#ff708d" opacity="0.8"/>

    <!-- Whiskers -->
    <g stroke="#4a2b13" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M 145 145 C 120 142 105 144 90 148"/>
      <path d="M 145 153 C 120 155 105 160 92 166"/>
      <path d="M 255 145 C 280 142 295 144 310 148"/>
      <path d="M 255 153 C 280 155 295 160 308 166"/>
    </g>

    <!-- Blinking Eyes -->
    <g class="anim-blink">
      <!-- Left Eye -->
      <circle cx="172" cy="142" r="13" fill="#1a120c"/>
      <circle cx="168" cy="138" r="5" fill="#ffffff"/>
      <circle cx="176" cy="146" r="2.5" fill="#ffffff"/>

      <!-- Right Eye -->
      <circle cx="228" cy="142" r="13" fill="#1a120c"/>
      <circle cx="224" cy="138" r="5" fill="#ffffff"/>
      <circle cx="232" cy="146" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Blue Glasses -->
    <g filter="url(#softGlow)">
      <rect x="144" y="120" width="54" height="42" rx="14" fill="#0284c7" fill-opacity="0.25" stroke="#00d2ff" stroke-width="4"/>
      <rect x="202" y="120" width="54" height="42" rx="14" fill="#0284c7" fill-opacity="0.25" stroke="#00d2ff" stroke-width="4"/>
      <path d="M 198 140 H 202 M 144 140 H 132 M 256 140 H 268" stroke="#00d2ff" stroke-width="4" stroke-linecap="round"/>
      <line x1="156" y1="126" x2="174" y2="154" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <line x1="214" y1="126" x2="232" y2="154" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Nose & Smile -->
    <path d="M 195 156 H 205 L 200 161 Z" fill="#f43f5e"/>
    <path d="M 200 161 C 194 168 186 167 182 163 M 200 161 C 206 168 214 167 218 163" fill="none" stroke="#4a2b13" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 194 166 Q 200 174 206 166 Z" fill="#ff708d"/>

    <!-- Red Collar & Bell -->
    <path d="M 170 195 Q 200 205 230 195" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <circle cx="200" cy="202" r="6" fill="#ffd166" stroke="#4a2b13" stroke-width="1.5"/>

    <!-- Left Resting Paw -->
    <g transform="translate(135, 275)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2.5"/>
      <circle cx="-5" cy="5" r="3" fill="#ffb4c3"/>
      <circle cx="5" cy="5" r="3" fill="#ffb4c3"/>
    </g>

    <!-- Right Waving Paw -->
    <g transform="translate(255, 230)">
      <g class="anim-wave">
        <path d="M 0 0 C 20 -20 35 -45 40 -65" fill="none" stroke="#4a2b13" stroke-width="18" stroke-linecap="round"/>
        <path d="M 0 0 C 20 -20 35 -45 40 -65" fill="none" stroke="url(#furGrad)" stroke-width="13" stroke-linecap="round"/>
        <!-- Paw Hand -->
        <g transform="translate(40, -68)">
          <ellipse cx="0" cy="0" rx="16" ry="14" fill="url(#furGrad)" stroke="#4a2b13" stroke-width="2.5"/>
          <ellipse cx="0" cy="2" rx="7" ry="5.5" fill="#ff8da1"/>
          <circle cx="-7" cy="-5" r="2.8" fill="#ff8da1"/>
          <circle cx="0" cy="-8" r="2.8" fill="#ff8da1"/>
          <circle cx="7" cy="-5" r="2.8" fill="#ff8da1"/>
        </g>
      </g>
    </g>

    <!-- Floating Kawaii Heart beside waving paw -->
    <g transform="translate(325, 120)">
      <g class="anim-heart-float">
        <path d="M 0 5 L -8 -3 C -13 -8 -8 -15 -2 -11 C 0 -9 0 -9 0 -9 C 0 -9 0 -9 2 -11 C 8 -15 13 -8 8 -3 Z" fill="#ff007a" filter="url(#softGlow)"/>
      </g>
    </g>
  </g>

  <!-- Futuristic Horizon Platform -->
  <g transform="translate(0, 280)">
    <rect x="20" y="0" width="360" height="40" rx="12" fill="#0d1722" stroke="#1f3647" stroke-width="2"/>
    <line x1="20" y1="0" x2="380" y2="0" stroke="url(#neonBeam)" stroke-width="3" filter="url(#softGlow)"/>
    <circle cx="45" cy="20" r="4" fill="#00f5a0" filter="url(#softGlow)"/>
    <text x="60" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#7da1b8">&gt; codey --ready-to-adopt</text>
    <text x="320" y="24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#00f5a0">v3.2</text>
  </g>
</svg>
